<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco do Desenvolvedor</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/script.js"></script>
</head>
<body>
    <div class="title">Banco Digital do Desenvolvedor</div>
    <div class="container">
            <h1>Bem-vindo ao Banco Digital do Desenvolvedor</h1>
            <p>Faça login para acessar sua conta.</p>
            <div class="form-container">
                <form onsubmit="entrar(); return false;">
                    <input type="text" id="usuario" name="username" placeholder="Usuário" required>
                    <input type="password" id="senha" name="password" placeholder="Senha" required>
                    <button class="button" type="submit">Entrar</button>
                </form>
            </div>  
        </div>
    </div>
